services:
  - type: web
    name: adabary-news-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: AUTO_PUBLISH_SCHEDULED
        value: "true"
      - key: AUTO_PUBLISH_BREAKING
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_OWNER_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
